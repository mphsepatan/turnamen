<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MPHS Tournament Bracket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * { font-family: 'Inter', sans-serif; }

        /* ── Bracket Layout ── */
        .bracket-wrapper {
            overflow-x: auto;
            padding: 20px 10px 30px 10px;
            background: #f1f5f9;
            border-radius: 16px;
        }
        .bracket-container {
            display: flex;
            gap: 0;
            min-width: max-content;
            align-items: stretch;
            padding: 10px 15px;
        }

        /* ── Round Column ── */
        .round-column {
            display: flex;
            flex-direction: column;
            min-width: 230px;
            position: relative;
            padding: 0 8px;
        }
        .round-header {
            background: linear-gradient(135deg, #1e293b, #334155);
            color: white;
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 5;
        }

        /* ── Match Slot ── */
        .match-slot {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            flex: 1;
            justify-content: center;
            min-height: 80px;
        }

        /* ── Match Card ── */
        .match-card {
            background: white;
            border-radius: 10px;
            padding: 8px 12px;
            width: 100%;
            max-width: 220px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-left: 4px solid #94a3b8;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            z-index: 2;
        }
        .match-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.13);
        }
        .match-card.status-done    { border-left-color: #22c55e; background: #f0fdf4; }
        .match-card.status-live    { border-left-color: #eab308; background: #fffbeb; animation: glow-live 1.5s infinite alternate; }
        .match-card.status-upcoming{ border-left-color: #94a3b8; background: #f8fafc; }

        @keyframes glow-live {
            0%   { box-shadow: 0 0 5px rgba(234,179,8,0.2); }
            100% { box-shadow: 0 0 20px rgba(234,179,8,0.5); }
        }

        /* ── Teams inside card ── */
        .team-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 3px 0;
            font-size: 0.72rem;
        }
        .team-row + .team-row { border-top: 1px dashed #e2e8f0; margin-top: 2px; padding-top: 4px; }
        .team-name {
            font-weight: 500;
            color: #1e293b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 140px;
        }
        .team-name.bye    { color: #94a3b8; font-style: italic; }
        .team-name.winner { color: #15803d; font-weight: 700; }
        .team-score {
            font-weight: 700;
            color: #0f172a;
            min-width: 24px;
            text-align: center;
            background: #f1f5f9;
            border-radius: 4px;
            padding: 1px 6px;
            font-size: 0.68rem;
        }
        .team-score.empty { background: transparent; color: #cbd5e1; }

        /* ── Status badge ── */
        .status-badge {
            font-size: 0.48rem;
            padding: 1px 7px;
            border-radius: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .status-badge.upcoming { background: #e2e8f0; color: #64748b; }
        .status-badge.done     { background: #bbf7d0; color: #166534; }
        .status-badge.live     { background: #fde68a; color: #92400e; }

        .winner-label {
            font-size: 0.58rem;
            font-weight: 700;
            color: #15803d;
            margin-top: 4px;
            padding-top: 4px;
            border-top: 1px dashed #e2e8f0;
            text-align: center;
        }

        /* ── Connector lines ── */
        /* horizontal line on right side of card → going to next column */
        .match-slot::after {
            content: '';
            position: absolute;
            right: -8px;
            top: 50%;
            width: 8px;
            height: 2px;
            background: #94a3b8;
            z-index: 0;
        }
        /* vertical bracket line between pairs — drawn by JS */
        .v-line {
            position: absolute;
            width: 2px;
            background: #94a3b8;
            right: -8px;
            z-index: 0;
        }
        .h-line-left {
            position: absolute;
            height: 2px;
            background: #94a3b8;
            left: -8px;
            top: 50%;
            width: 8px;
            z-index: 0;
        }

        /* last column: no right connectors */
        .round-column:last-child .match-slot::after { display: none; }
        .round-column:last-child .v-line            { display: none; }

        /* ── Tabs ── */
        .tab-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 9px 20px;
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 600;
            border: 2px solid transparent;
            background: white;
            color: #374151;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
        }
        .tab-btn:hover  { background: #f8fafc; border-color: #cbd5e1; }
        .tab-btn.active { background: #eff6ff; border-color: #3b82f6; color: #1d4ed8; }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .round-column  { min-width: 160px; }
            .team-name     { max-width: 90px; font-size: 0.62rem; }
            .match-card    { padding: 5px 8px; }
            .round-header  { font-size: 0.62rem; padding: 5px 10px; }
        }

        /* ── Error / Empty ── */
        .error-box {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            border-radius: 10px;
            padding: 16px 24px;
            margin: 20px auto;
            max-width: 480px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-6">
<div class="max-w-7xl mx-auto">

    <!-- LOGO -->
    <div class="flex justify-center mb-4">
        <img src="https://raw.githubusercontent.com/mphsepatan/paguyuban/refs/heads/main/assets/img/logo.png"
             alt="MPHS Logo"
             class="h-20 w-auto object-contain drop-shadow-md" />
    </div>

    <!-- HEADER -->
    <div class="flex flex-wrap items-center justify-between bg-white rounded-2xl shadow-md p-4 mb-5 border-l-4 border-blue-600">
        <div class="flex items-center gap-3">
            <i class="fas fa-trophy text-3xl text-yellow-500"></i>
            <div>
                <h1 class="text-xl font-bold text-gray-800 leading-tight">MPHS Tournament</h1>
                <span class="text-xs text-gray-400 font-medium">Bracket Turnamen</span>
            </div>
        </div>
        <div class="flex items-center gap-2 text-sm text-gray-500 mt-2 sm:mt-0">
            <i class="fas fa-clock text-blue-400"></i>
            <span>Update: <span id="updateTime" class="font-semibold text-gray-700">—</span></span>
            <button onclick="loadTab(currentTab)" class="ml-2 bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1">
                <i class="fas fa-redo text-xs"></i> Refresh
            </button>
        </div>
    </div>

    <!-- TABS -->
    <div class="flex flex-wrap gap-2 mb-5" id="tabContainer">
        <button class="tab-btn active" onclick="loadTab('Mobile Legend')" data-tab="Mobile Legend">
            <i class="fas fa-gamepad text-purple-600"></i> Mobile Legend
        </button>
        <button class="tab-btn" onclick="loadTab('Catur')" data-tab="Catur">
            <i class="fas fa-chess text-green-700"></i> Catur
        </button>
        <button class="tab-btn" onclick="loadTab('Bulu Tangkis')" data-tab="Bulu Tangkis">
            <i class="fas fa-feather text-orange-500"></i> Bulu Tangkis
        </button>
    </div>

    <!-- BRACKET AREA -->
    <div class="bg-white rounded-2xl shadow-lg p-4 md:p-6">
        <div id="loadingArea" class="flex justify-center items-center py-20 gap-3">
            <i class="fas fa-spinner fa-spin text-3xl text-blue-500"></i>
            <span class="text-gray-500 text-base">Memuat data dari Google Sheets...</span>
        </div>
        <div id="bracketArea" class="hidden">
            <div class="bracket-wrapper">
                <div id="bracketContainer" class="bracket-container"></div>
            </div>
        </div>
        <div id="errorArea" class="hidden"></div>
    </div>

    <!-- LEGEND -->
    <div class="mt-5 flex flex-wrap justify-center gap-6 text-xs text-gray-500">
        <span><span class="inline-block w-3 h-3 rounded-full bg-green-500 mr-1.5"></span>Selesai</span>
        <span><span class="inline-block w-3 h-3 rounded-full bg-yellow-400 animate-pulse mr-1.5"></span>Sedang Berlangsung</span>
        <span><span class="inline-block w-3 h-3 rounded-full bg-gray-300 mr-1.5"></span>Mendatang</span>
        <span class="text-yellow-600"><i class="fas fa-crown mr-1"></i>Pemenang</span>
    </div>

    <!-- DATA SOURCE NOTE -->
 

    <!-- COPYRIGHT -->
    <p class="text-center text-xs text-gray-400 mt-2 pb-4">
        &copy; 2026 <span class="font-semibold text-gray-500">Ryuzel</span>. All rights reserved.
    </p>

</div>

<script>
// ============================================================
// KONFIGURASI — ganti SPREADSHEET_ID jika perlu
// ============================================================
const SPREADSHEET_ID = '1uhvvUrRCef7sGnzviEViSc1-_ifZ5JNlhkknxKmIJs8';

// Nama sheet di Google Sheets (harus sama persis)
const SHEET_CONFIG = {
    'Mobile Legend': {
        sheetName: 'Mobile Legend',
        icon: 'fa-gamepad',
        iconColor: 'text-purple-600'
    },
    'Catur': {
        sheetName: 'Catur',
        icon: 'fa-chess',
        iconColor: 'text-green-700'
    },
    'Bulu Tangkis': {
        sheetName: 'Bulu Tangkis',
        icon: 'fa-feather',
        iconColor: 'text-orange-500'
    }
};

// Round metadata (urutan, label, ikon)
const ROUND_META = {
    'R32':  { label: 'Babak 32 Besar', icon: 'fa-arrow-right' },
    'R16':  { label: 'Babak 16 Besar', icon: 'fa-arrow-right' },
    'QF':   { label: 'Perempat Final', icon: 'fa-chess-queen' },
    'SF':   { label: 'Semifinal',       icon: 'fa-star' },
    'F':    { label: 'Final',           icon: 'fa-trophy' },
    '3rd':  { label: 'Perebutan 3',     icon: 'fa-medal' }
};
const ROUND_ORDER = ['R32', 'R16', 'QF', 'SF', 'F', '3rd'];

let currentTab = 'Mobile Legend';

// ============================================================
// FETCH DATA DARI GOOGLE SHEETS via CSV export
// Pakai URL: https://docs.google.com/spreadsheets/d/{ID}/gviz/tq?tqx=out:csv&sheet={SHEET}
// ============================================================
async function fetchSheetCSV(sheetName) {
    const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status} saat mengambil sheet "${sheetName}"`);
    return await res.text();
}

// ============================================================
// PARSE CSV → array of objects
// ============================================================
function parseCSV(csvText) {
    const lines = csvText.trim().split('\n');
    if (lines.length < 2) return [];

    // Parse satu baris CSV (handle quoted fields)
    function parseLine(line) {
        const result = [];
        let cur = '', inQuote = false;
        for (let i = 0; i < line.length; i++) {
            const ch = line[i];
            if (ch === '"') {
                if (inQuote && line[i+1] === '"') { cur += '"'; i++; }
                else inQuote = !inQuote;
            } else if (ch === ',' && !inQuote) {
                result.push(cur.trim()); cur = '';
            } else {
                cur += ch;
            }
        }
        result.push(cur.trim());
        return result;
    }

    const headers = parseLine(lines[0]);
    const rows = [];
    for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const vals = parseLine(lines[i]);
        const obj = {};
        headers.forEach((h, idx) => { obj[h] = vals[idx] || ''; });
        rows.push(obj);
    }
    return rows;
}

// ============================================================
// CONVERT RAW ROWS → structured rounds
// ============================================================
function buildRounds(rows) {
    // Filter baris yang punya kolom Round & Match valid
    const matchRows = rows.filter(r => r['Round'] && r['Match'] && !isNaN(parseFloat(r['Match'])));

    // Group by round
    const grouped = {};
    matchRows.forEach(r => {
        const round = r['Round'].trim();
        if (!grouped[round]) grouped[round] = [];
        grouped[round].push(r);
    });

    // Sort rounds sesuai ROUND_ORDER, lalu sisanya di belakang
    const orderedKeys = ROUND_ORDER.filter(k => grouped[k]);
    const extraKeys   = Object.keys(grouped).filter(k => !ROUND_ORDER.includes(k));
    const allKeys = [...orderedKeys, ...extraKeys];

    return allKeys.map(roundKey => {
        const meta = ROUND_META[roundKey] || { label: roundKey, icon: 'fa-circle' };
        const matches = grouped[roundKey]
            .sort((a, b) => parseFloat(a['Match']) - parseFloat(b['Match']))
            .map(r => {
                const winner = r['Winner'] && r['Winner'] !== '–' && r['Winner'] !== '-' ? r['Winner'].trim() : null;
                return {
                    team1:  r['Team1']  || '',
                    team2:  r['Team2']  || '',
                    score1: r['Score1'] || '',
                    score2: r['Score2'] || '',
                    status: (r['Status'] || 'upcoming').toLowerCase().trim(),
                    winner: winner
                };
            });
        return { key: roundKey, label: meta.label, icon: meta.icon, matches };
    });
}

// ============================================================
// RENDER BRACKET
// ============================================================
function renderBracket(rounds) {
    const container = document.getElementById('bracketContainer');

    if (!rounds || rounds.length === 0) {
        container.innerHTML = `<div class="text-center text-gray-400 py-10 text-sm"><i class="fas fa-inbox text-2xl mb-2 block"></i>Tidak ada data pertandingan</div>`;
        return;
    }

    let html = '';

    rounds.forEach((round, roundIdx) => {
        html += `<div class="round-column" id="rc-${roundIdx}">`;
        html += `<div class="round-header">
                    <i class="fas ${round.icon}"></i> ${round.label}
                 </div>`;

        if (!round.matches.length) {
            html += `<div class="match-slot"><div class="match-card status-upcoming" style="opacity:.5;text-align:center;padding:10px"><span class="text-xs text-gray-400">Belum ada data</span></div></div>`;
        } else {
            round.matches.forEach((m, mIdx) => {
                const sc    = m.status === 'done' ? 'status-done' : m.status === 'live' ? 'status-live' : 'status-upcoming';
                const badge = m.status === 'done' ? 'done' : m.status === 'live' ? 'live' : 'upcoming';
                const badgeTxt = m.status === 'done' ? 'Selesai' : m.status === 'live' ? '● Live' : 'Mendatang';

                const t1 = m.team1 || 'BYE';
                const t2 = m.team2 || 'BYE';
                const s1 = m.score1;
                const s2 = m.score2;
                const w  = m.winner;

                const isBye1 = t1 === 'BYE';
                const isBye2 = t2 === 'BYE';
                const isW1 = w && w === t1;
                const isW2 = w && w === t2;

                const crown = `<i class="fas fa-crown text-yellow-500 mr-1" style="font-size:0.6rem"></i>`;

                html += `
                <div class="match-slot" id="ms-${roundIdx}-${mIdx}">
                    <div class="h-line-left"></div>
                    <div class="match-card ${sc}">
                        <div class="flex justify-between items-center mb-1.5">
                            <span class="text-gray-400 font-semibold" style="font-size:0.55rem">M${mIdx+1}</span>
                            <span class="status-badge ${badge}">${badgeTxt}</span>
                        </div>
                        <div class="team-row">
                            <span class="team-name ${isBye1?'bye':''} ${isW1?'winner':''}" title="${t1}">
                                ${isW1?crown:''}${t1}
                            </span>
                            <span class="team-score ${s1===''?'empty':''}">${s1||'–'}</span>
                        </div>
                        <div class="team-row">
                            <span class="team-name ${isBye2?'bye':''} ${isW2?'winner':''}" title="${t2}">
                                ${isW2?crown:''}${t2}
                            </span>
                            <span class="team-score ${s2===''?'empty':''}">${s2||'–'}</span>
                        </div>
                        ${w ? `<div class="winner-label"><i class="fas fa-trophy text-yellow-500 mr-1" style="font-size:0.55rem"></i>${w}</div>` : ''}
                    </div>
                </div>`;
            });
        }

        html += `</div>`;
    });

    container.innerHTML = html;

    // Draw vertical bracket lines between paired matches
    drawConnectors(rounds);
}

// ============================================================
// DRAW VERTICAL CONNECTORS (lines joining pairs into next round)
// ============================================================
function drawConnectors(rounds) {
    rounds.forEach((round, rIdx) => {
        if (rIdx === rounds.length - 1) return; // no connectors from last col
        const col = document.getElementById(`rc-${rIdx}`);
        if (!col) return;
        const slots = round.matches.length;
        // Pair matches 2-by-2 → connect to one match in next round
        for (let i = 0; i < slots; i += 2) {
            const s1 = document.getElementById(`ms-${rIdx}-${i}`);
            const s2 = document.getElementById(`ms-${rIdx}-${i+1}`);
            if (!s1 || !s2) continue;

            const colRect = col.getBoundingClientRect();
            const r1 = s1.getBoundingClientRect();
            const r2 = s2.getBoundingClientRect();

            const top    = r1.top  + r1.height/2 - colRect.top;
            const bottom = r2.top  + r2.height/2 - colRect.top;
            const height = bottom - top;

            const vLine = document.createElement('div');
            vLine.className = 'v-line';
            vLine.style.top    = top + 'px';
            vLine.style.height = height + 'px';
            col.appendChild(vLine);
        }
    });
}

// ============================================================
// LOAD TAB
// ============================================================
async function loadTab(tabName) {
    currentTab = tabName;

    // Update active tab button
    document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.tab === tabName);
    });

    // Show loading
    document.getElementById('loadingArea').classList.remove('hidden');
    document.getElementById('bracketArea').classList.add('hidden');
    document.getElementById('errorArea').classList.add('hidden');

    try {
        const cfg = SHEET_CONFIG[tabName];
        const csv = await fetchSheetCSV(cfg.sheetName);
        const rows = parseCSV(csv);
        const rounds = buildRounds(rows);

        document.getElementById('loadingArea').classList.add('hidden');
        document.getElementById('bracketArea').classList.remove('hidden');

        renderBracket(rounds);
        document.getElementById('updateTime').textContent = new Date().toLocaleTimeString('id-ID');

    } catch (err) {
        console.error(err);
        document.getElementById('loadingArea').classList.add('hidden');
        document.getElementById('errorArea').classList.remove('hidden');
        document.getElementById('errorArea').innerHTML = `
            <div class="error-box">
                <div class="flex items-center gap-2 font-bold mb-2">
                    <i class="fas fa-exclamation-triangle"></i>
                    Gagal memuat data
                </div>
                <p>${err.message}</p>
                <p class="mt-2 text-xs text-red-500">
                    Pastikan Google Sheets sudah di-share sebagai
                    <strong>"Anyone with the link can view"</strong>
                    dan nama sheet sudah sama persis.
                </p>
                <button onclick="loadTab(currentTab)" class="mt-3 bg-red-100 hover:bg-red-200 text-red-700 px-4 py-1.5 rounded-lg text-xs font-semibold transition">
                    <i class="fas fa-redo mr-1"></i>Coba Lagi
                </button>
            </div>`;
    }
}

// ============================================================
// INIT
// ============================================================
loadTab('Mobile Legend');

// Auto-refresh setiap 60 detik (hanya saat tab aktif)
setInterval(() => {
    if (!document.hidden) loadTab(currentTab);
}, 60000);
</script>
</body>
</html>
